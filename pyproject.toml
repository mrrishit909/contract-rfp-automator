[project]
name = "contract-rfp-automator"
version = "0.1.0"
description = "Reads contracts and RFPs, scores every clause against a corporate playbook and drafts replacements"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "httpx>=0.27", "python-multipart>=0.0.9",
    "pdfplumber>=0.11", "python-docx>=1.1", "pytesseract>=0.3.13", "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "mypy>=1.11"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["app"]
[[tool.mypy.overrides]]
module = ["pytesseract", "docx", "docx.*", "pdfplumber"]
ignore_missing_imports = true
